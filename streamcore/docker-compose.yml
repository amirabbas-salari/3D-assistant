# از صفر — StreamCore + سام
# اجرا از ریشه پروژه:
#   docker compose -f streamcore/docker-compose.yml up --build
# اگر Docker Desktop خاموشه، اول از Start Menu اجراش کن تا "Engine running" بشه

services:
  streamcore-server:
    image: ghcr.io/streamcoreai/streamcore-server:latest
    # از image مستقیم استفاده کن — build از URL روی Windows کار نمی‌کنه
    ports:
      - "8080:8080"
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "50001-60000:50001-60000/udp"
    volumes:
      - ./config.toml:/config.toml:ro
    env_file:
      - ../.env
    depends_on:
      - streamcore-agent
    restart: unless-stopped
    networks:
      - sam-net

  streamcore-agent:
    build:
      context: ..
      dockerfile: infra/streamcore/Dockerfile.agent
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../prompts:/app/prompts:ro
      - ../knowledge:/app/knowledge:ro
    restart: unless-stopped
    networks:
      - sam-net
    command: uvicorn sam_streamcore.server:app --host 0.0.0.0 --port 8000 --workers 2

networks:
  sam-net:
    driver: bridge
