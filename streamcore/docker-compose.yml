# از صفر — StreamCore + سام
# اجرا: docker compose -f streamcore/docker-compose.yml up --build

services:
  streamcore-server:
    image: ghcr.io/streamcoreai/streamcore-server:latest
    build:
      context: https://github.com/streamcoreai/streamcore-server.git#main
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "50001-60000:50001-60000/udp"
    volumes:
      - ./config.toml:/config.toml:ro
    env_file:
      - ../.env
    depends_on:
      - streamcore-agent
    restart: unless-stopped
    networks:
      - sam-net

  streamcore-agent:
    build:
      context: ../
      dockerfile: infra/streamcore/Dockerfile.agent
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../prompts:/app/prompts:ro
      - ../knowledge:/app/knowledge:ro
    restart: unless-stopped
    networks:
      - sam-net
    command: uvicorn sam_streamcore.server:app --host 0.0.0.0 --port 8000 --workers 2

  # اختیاری: برای تست لوکال بدون API key
  # vibevoice-asr:
  #   image: vibevoice/asr:latest
  #   ports: ["8200:8200"]
  # vibevoice-tts:
  #   image: vibevoice/tts:latest
  #   ports: ["8300:8300"]

networks:
  sam-net:
    driver: bridge
