# StreamCore — پیکربندی برای سام (فارسی)
# از صفر: فقط صدا، بدون آواتار، local Docker
# کپی کن به config.toml و کلیدها رو پر کن

[server]
port = "8080"
public_ip = ""      # روی VPS پر کن، لوکال خالی
turn_secret = ""    # برای STUN/TURN وقتی public_ip داری
jwt_secret = ""     # اگر می‌خوای /whip با JWT محافظت بشه، خالی = بدون احراز
api_key = ""        # برای POST /token — خالی = بدون احراز
session_grace_ms = 30000
max_sessions = 0

[stt]
provider = "deepgram"
[deepgram]
api_key = "${DEEPGRAM_API_KEY}"
model = "nova-3"
language = "fa"

# جایگزین: اگر می‌خوای از LiveKit Inference-style deepgram استفاده کنی، همین بالایی کافیه
# [stt.openai] برای whisper-1 هم پشتیبانی می‌شه:
# [stt]
# provider = "openai"
# [stt.openai]
# api_key = "${OPENAI_API_KEY}"
# model = "gpt-4o-transcribe"

[llm]
provider = "agent"

[agent]
url = "http://streamcore-agent:8000/agent"
api_key = ""
timeout_ms = 30000

# اگر می‌خوای مستقیم LLM داخل StreamCore باشه (بدون HTTP agent):
# [llm]
# provider = "openai"
# [openai]
# api_key = "${OPENAI_API_KEY}"
# model = "gpt-4o-mini"

# یا OpenRouter (OpenAI-compatible):
# [llm]
# provider = "openai"
# [openai]
# api_key = "${OPENROUTER_API_KEY}"
# base_url = "https://openrouter.ai/api/v1"
# model = "openai/gpt-4o-mini"

[tts]
provider = "cartesia"
[cartesia]
api_key = "${CARTESIA_API_KEY}"
model = "sonic-3"
language = "fa"
voice = "fa-calm-male"  # یا هر voice فارسی Cartesia

# جایگزین ElevenLabs:
# [tts]
# provider = "elevenlabs"
# [elevenlabs]
# api_key = "${ELEVENLABS_API_KEY}"
# model = "eleven_flash_v2_5"
# voice_id = "JBFqnCBsd6RMkjVDRZzb"
# language = "fa"

# جایگزین لوکال (بدون کلید):
# [stt]
# provider = "vibevoice"
# [vibevoice]
# asr_url = "ws://127.0.0.1:8200"
# [tts]
# provider = "vibevoice"
# [vibevoice]
# tts_url = "http://127.0.0.1:8300"

# VAD
[vad]
provider = "silero"
threshold = 0.5

# Plugins (اختیاری)
[plugins]
directory = "./plugins"

# Display projector خاموش (مثل LiveKit latency panel خودت)
[display]
enabled = false
