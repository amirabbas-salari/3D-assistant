version: "3.9"
services:
  api:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.api }
    ports: ["3001:3001"]
    env_file: ../../.env
  web:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.web }
    ports: ["3000:80"]
    depends_on: [api]
  agent:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.agent }
    env_file: ../../.env
    depends_on: [api]
