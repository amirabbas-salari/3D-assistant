[project]
name = "sam-voice-agent"
version = "1.0.0"
description = "Persian LiveKit voice agent (سام) — RAG + avatar + latency instrumentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents~=1.8",
    "livekit-plugins-openai~=1.8",
    "livekit-plugins-deepgram~=1.8",
    "livekit-plugins-google~=1.8",
    "livekit-plugins-elevenlabs~=1.8",
    "livekit-plugins-tavus~=1.8",
    "livekit-plugins-spatius~=1.8",
    "python-dotenv>=1.0.0",
    "chromadb>=1.0.0",
    "openai>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0",
    "pyright>=1.1",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
sam-agent = "sam.agent:main"
